name: Build and Push Docker Image

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from release tag
        id: version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches Dockerfile Alpine version
        run: |
          ALPINE_VERSION=$(grep -m1 '^ARG ALPINE_VERSION=' Dockerfile | sed -E 's/ARG ALPINE_VERSION="?([^"]*)"?/\1/')
          if [ -z "$ALPINE_VERSION" ]; then
            echo "[ERROR] Could not determine ALPINE_VERSION from Dockerfile"
            exit 1
          fi
          TAG_VERSION="${{ steps.version.outputs.version }}"
          TAG_ALPINE_VERSION="${TAG_VERSION%-*}"
          if [ "$TAG_ALPINE_VERSION" != "$ALPINE_VERSION" ]; then
            echo "[ERROR] Release tag ($TAG_VERSION) does not match ARG ALPINE_VERSION=$ALPINE_VERSION in Dockerfile (expected tag <AlpineVersion>-<Revision>)"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: alexanderwolz
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: alexanderwolz/toolbox:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,mode=max,scope=toolbox
